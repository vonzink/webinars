<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Your first home, without the mystery. — Mountain State Financial Group</title>
  <meta name="description" content="A beginner first-time homebuyer class from Mountain State Financial Group.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/slides.css">
  <link rel="stylesheet" href="./css/cash-to-close.css">
</head>
<body>
  <div class="deck-progress" style="width:0"></div>
  <main class="stage" aria-label="Presentation slides">
    <div class="slide-fit-shell" data-fit-shell>
      <div class="slide-scaler" data-fit-surface></div>
    </div>
  </main>
  <div id="modal-root" class="modal-root"></div>

  <nav class="deck-nav" aria-label="Slide navigation">
    <button type="button" data-nav="prev" aria-label="Previous slide">‹</button>
    <span class="nav-count" aria-live="polite">1 / 15</span>
    <button type="button" data-nav="next" aria-label="Next slide">›</button>
    <button type="button" data-nav="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen (F)">⛶</button>
    <button type="button" data-nav="presenter" aria-label="Open presenter view" title="Presenter view (P)">▤</button>
  </nav>

  <p class="visually-hidden">Arrow keys move between slides. P opens presenter view, F fullscreen, G layout guides.</p>

  <script type="module">
    import { initDeck } from './js/deck.js';
    initDeck();
    let t;
    window.addEventListener('mousemove', () => {
      document.body.classList.add('nav-visible');
      clearTimeout(t); t = setTimeout(() => document.body.classList.remove('nav-visible'), 2200);
    });
  </script>
</body>
</html>
